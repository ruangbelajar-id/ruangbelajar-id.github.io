<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuangBelajar • Portal Materi & Ujian Digital</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%234F46E5'/%3E%3Cstop offset='100%25' stop-color='%232563EB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 16L10 27l22 11 18-9v13h4V27L32 16zm-12 18.5v7.5c0 4.5 5.4 8 12 8s12-3.5 12-8v-7.5l-12 6-12-6z' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation"
    allow="clipboard-read; clipboard-write; fullscreen; autoplay; storage-access"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen
    loading="eager">
  </iframe>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyH19x4revBAEBLB18LLDVVgSlADO0hQFG8cPp8YhGcO4kgdL4GxibzJqLVmLPOhnKXGQ/exec";
    const queryString = window.location.search;
    const params = new URLSearchParams(queryString);
    const page = (params.get("page") || "").toLowerCase();

    const pageTitles = {
      "kakomli": "Panel Kakomli • Kepala Program Keahlian",
      "ops": "Panel OPS • Operator Sekolah",
      "administrasi": "AdminGuru • Administrasi Guru",
      "admin": "RuangBelajar • Panel Pengajar & Admin",
      "banksoal": "Bank Soal & CBT Asesmen • RuangBelajar",
      "ujian": "Ruang Ujian CBT • RuangBelajar"
    };
    document.title = pageTitles[page] || "RuangBelajar • Portal Materi & Ujian Digital";

    window.addEventListener("message", function(event) {
      if (!event.data) return;
      if (event.data.type === "SET_PAGE_TITLE" && event.data.title) {
        document.title = event.data.title;
      }
      if (event.data.type === "NAVIGATE_PORTAL" && typeof event.data.search === "string") {
        window.location.href = window.location.origin + window.location.pathname + event.data.search;
      }
    });

    document.getElementById("appFrame").src = GAS_WEBAPP_URL + (queryString || "");
  </script>
</body>
</html>
